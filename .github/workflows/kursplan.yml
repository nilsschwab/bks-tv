# Holt stuendlich den oeffentlichen Virtuagym-Kursplan und legt ihn als kurse.json ab.
# GitHub Pages veroeffentlicht die Aenderung danach von selbst.
# Quelle dieser Datei: Claude Code\fernseher\werkzeug\kursplan.yml (wird von
# veroeffentlichen.ps1 nach .github/workflows/ kopiert - hier nicht direkt aendern).
name: Kursplan aktualisieren

on:
  schedule:
    - cron: '17 4-20 * * *'   # stuendlich, etwa 6 bis 22 Uhr deutscher Zeit (Angabe in UTC)
  workflow_dispatch:           # von Hand starten: Actions -> Kursplan aktualisieren -> Run workflow
  push:
    paths:
      - 'werkzeug/kursplan-holen.mjs'
      - '.github/workflows/kursplan.yml'

permissions:
  contents: write

concurrency:
  group: kursplan
  cancel-in-progress: false

jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v4
      - name: Kursplan holen
        run: node werkzeug/kursplan-holen.mjs kurse.json
      - name: Aenderung veroeffentlichen
        run: |
          if git diff --quiet -- kurse.json; then
            echo "Keine Aenderung."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kurse.json
          git commit -m "Kursplan aktualisiert"
          git push
